<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#b8954a">
  <meta name="description" content="Offline shopping list with automatic categories (English &amp; Lithuanian)">
  <title>Shopping List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg-body: #e8f1f8;
      --surface: #dfe8df;
      --surface-input: rgba(255, 255, 255, 0.72);
      --text: #2c2e30;
      --muted: rgba(44, 46, 48, 0.62);
      --label: rgba(44, 46, 48, 0.78);
      --gold: #b8954a;
      --gold-deep: #4a4438;
      --gold-soft: rgba(184, 149, 74, 0.2);
      --gold-border: rgba(184, 149, 74, 0.48);
      --border: rgba(72, 88, 72, 0.22);
      --danger: #c45c54;
      --tick: rgba(44, 46, 48, 0.45);
      --radius: 12px;
      --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.92) inset, 0 -10px 24px rgba(100, 130, 120, 0.07) inset, 0 10px 28px rgba(70, 95, 120, 0.07);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light only;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      color-scheme: light only;
      background-color: #e8f1f8;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background-color: #e8f1f8;
      background:
        radial-gradient(ellipse 82% 68% at 50% 38%, rgba(198, 218, 235, 0.5) 0%, transparent 62%),
        radial-gradient(960px 640px at 12% -4%, rgba(210, 228, 242, 0.45) 0%, transparent 56%),
        radial-gradient(820px 560px at 90% 8%, rgba(185, 210, 225, 0.35) 0%, transparent 54%),
        linear-gradient(180deg, #eef5fa 0%, #e8f1f8 50%, #e0ecf4 100%);
    }
    .app { max-width: 520px; margin: 0 auto; padding: 1rem 1rem calc(1.5rem + var(--safe-bottom)); }
    header { text-align: center; margin-bottom: 1.25rem; }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      color: var(--gold-deep);
      letter-spacing: -0.02em;
    }
    header p { margin: 0; font-size: 0.875rem; color: var(--muted); }
    .add-panel {
      background-color: var(--surface);
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.2) 42%, rgba(248, 252, 247, 0.9));
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 1rem;
      margin-bottom: 1.25rem;
    }
    .add-panel label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--label); margin-bottom: 0.5rem; }
    textarea {
      width: 100%;
      min-height: 5.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
      background: var(--surface-input);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.95) inset, 0 2px 8px rgba(80, 70, 50, 0.06) inset;
      color: var(--text);
    }
    textarea:focus {
      outline: none;
      border-color: rgba(184, 149, 74, 0.55);
      box-shadow: 0 0 0 3px var(--gold-soft), 0 1px 0 rgba(255, 255, 255, 0.95) inset;
    }
    .add-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-weight: 600;
    }
    .btn-primary {
      background: linear-gradient(180deg, rgba(210, 180, 110, 0.95), rgba(184, 149, 74, 0.92));
      color: #3d3428;
      flex: 1;
      min-width: 8rem;
      border: 1px solid var(--gold-border);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset, 0 3px 10px rgba(184, 149, 74, 0.18);
    }
    .btn-primary:active { filter: brightness(0.97); }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.55);
      color: var(--gold-deep);
      border: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85) inset;
    }
    .btn-danger {
      background: rgba(196, 92, 84, 0.12);
      color: var(--danger);
      font-size: 0.85rem;
      border: 1px solid rgba(196, 92, 84, 0.22);
    }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .toolbar button { font-size: 0.85rem; padding: 0.45rem 0.75rem; }
    .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; font-size: 0.95rem; }
    .category { margin-bottom: 1.25rem; }
    .category h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin: 0 0 0.5rem 0.35rem;
      font-weight: 700;
    }
    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      background-color: var(--surface);
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.15) 40%);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.55);
      overflow: hidden;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border);
      touch-action: manipulation;
    }
    .item:last-child { border-bottom: none; }
    .item.ticked .item-label { text-decoration: line-through; color: var(--tick); }
    .item-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .check {
      width: 1.35rem;
      height: 1.35rem;
      border: 2px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #3d3428;
      background: rgba(255, 255, 255, 0.72);
    }
    .item.ticked .check {
      background: linear-gradient(180deg, rgba(210, 180, 110, 0.95), rgba(184, 149, 74, 0.92));
      border-color: var(--gold-border);
    }
    .item-label { font-size: 1rem; word-break: break-word; }
    .item-delete {
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.5rem;
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 6px;
    }
    .item-delete:hover, .item-delete:focus-visible { background: rgba(196, 92, 84, 0.12); color: var(--danger); }
    .offline-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold-deep);
      border: 1px solid rgba(184, 149, 74, 0.28);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Shopping List</h1>
      <p>English or Lithuanian · comma or new line</p>
      <span class="offline-badge" id="swStatus" hidden>PWA ready</span>
    </header>

    <section class="add-panel" aria-label="Add items">
      <label for="bulkInput">Add items</label>
      <textarea id="bulkInput" placeholder="e.g. milk, obuoliai, duona&#10;vištiena, pomidorai"></textarea>
      <div class="add-row">
        <button type="button" class="btn-primary" id="btnAdd">Add to list</button>
      </div>
    </section>

    <div class="toolbar" id="toolbar" hidden>
      <button type="button" class="btn-ghost" id="btnClearTicked">Clear ticked</button>
      <button type="button" class="btn-danger" id="btnClearAll">Clear all</button>
    </div>

    <main id="listRoot" aria-live="polite"></main>
  </div>

  <script src="categorise.js"></script>
  <script>
    const STORAGE_KEY = 'shopping-list-items-v1';

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        let changed = false;
        const refreshed = parsed.map((it) => {
          const category = categorize(it.name);
          if (it.category !== category) changed = true;
          return { ...it, category };
        });
        if (changed) saveItems(refreshed);
        return refreshed;
      } catch {
        return [];
      }
    }

    let items = loadItems();

    function parseBulkInput(text) {
      return text
        .split(/[\n,;]+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function displayName(raw) {
      return raw.trim().replace(/\s+/g, ' ');
    }

    function addItemsFromInput() {
      const ta = document.getElementById('bulkInput');
      const names = parseBulkInput(ta.value);
      if (!names.length) return;
      for (const name of names) {
        const label = displayName(name);
        items.push({
          id: uid(),
          name: label,
          category: categorize(label),
          ticked: false
        });
      }
      saveItems(items);
      ta.value = '';
      render();
    }

    function toggleItem(id) {
      const it = items.find(x => x.id === id);
      if (it) {
        it.ticked = !it.ticked;
        saveItems(items);
        render();
      }
    }

    function deleteItem(id) {
      items = items.filter(x => x.id !== id);
      saveItems(items);
      render();
    }

    function clearTicked() {
      const before = items.length;
      items = items.filter(x => !x.ticked);
      if (items.length !== before) {
        saveItems(items);
        render();
      }
    }

    function clearAll() {
      if (!items.length) return;
      if (confirm('Remove every item from the list?')) {
        items = [];
        saveItems(items);
        render();
      }
    }

    function groupByCategory(list) {
      /** @type {Record<string, typeof items>} */
      const map = {};
      for (const cat of CATEGORY_ORDER) map[cat] = [];
      for (const it of list) {
        const c = CATEGORY_ORDER.includes(it.category) ? it.category : 'Other';
        map[c].push(it);
      }
      for (const cat of CATEGORY_ORDER) {
        map[cat].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
      }
      return map;
    }

    function render() {
      const root = document.getElementById('listRoot');
      const toolbar = document.getElementById('toolbar');
      root.innerHTML = '';

      if (!items.length) {
        toolbar.hidden = true;
        root.innerHTML = '<p class="empty">Your list is empty. Add groceries above.</p>';
        return;
      }

      toolbar.hidden = false;
      const groups = groupByCategory(items);

      for (const cat of CATEGORY_ORDER) {
        const group = groups[cat];
        if (!group.length) continue;
        const section = document.createElement('section');
        section.className = 'category';
        section.setAttribute('aria-label', cat);
        const h2 = document.createElement('h2');
        h2.textContent = cat;
        section.appendChild(h2);
        const ul = document.createElement('ul');
        ul.className = 'item-list';
        for (const it of group) {
          const li = document.createElement('li');
          li.className = 'item' + (it.ticked ? ' ticked' : '');
          li.dataset.id = it.id;

          const main = document.createElement('div');
          main.className = 'item-main';
          main.setAttribute('role', 'button');
          main.setAttribute('tabindex', '0');
          main.setAttribute('aria-pressed', it.ticked ? 'true' : 'false');

          const check = document.createElement('span');
          check.className = 'check';
          check.setAttribute('aria-hidden', 'true');
          if (it.ticked) check.textContent = '✓';

          const label = document.createElement('span');
          label.className = 'item-label';
          label.textContent = it.name;

          main.appendChild(check);
          main.appendChild(label);

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'item-delete';
          del.setAttribute('aria-label', 'Delete ' + it.name);
          del.textContent = '×';

          main.addEventListener('click', () => toggleItem(it.id));
          main.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleItem(it.id);
            }
          });
          del.addEventListener('click', e => {
            e.stopPropagation();
            deleteItem(it.id);
          });

          li.appendChild(main);
          li.appendChild(del);
          ul.appendChild(li);
        }
        section.appendChild(ul);
        root.appendChild(section);
      }
    }

    document.getElementById('btnAdd').addEventListener('click', addItemsFromInput);
    document.getElementById('bulkInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        addItemsFromInput();
      }
    });
    document.getElementById('btnClearTicked').addEventListener('click', clearTicked);
    document.getElementById('btnClearAll').addEventListener('click', clearAll);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(() => {
            const el = document.getElementById('swStatus');
            el.hidden = false;
          })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    render();
  </script>
</body>
</html>
